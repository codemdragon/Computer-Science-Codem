<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2CS Revision | 9709 Cambridge</title>
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-dark: #050505;
            --bg-panel: #111111;
            --bg-card: #161616;
            --bg-card-hover: #1a1a1a;
            --accent-blue: #0066cc;
            --accent-blue-bright: #0080ff;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --code-font: 'Consolas', 'Monaco', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }

        html {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            height: 100vh;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }

        button,
        .nav-item,
        .mobile-menu-btn,
        .chip,
        summary,
        .chapter-item,
        .brow-head,
        .add-chap-btn,
        a {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @keyframes tap-feedback {
            0% {
                transform: scale(1);
                filter: brightness(1);
                box-shadow: 0 0 0 rgba(0, 136, 255, 0);
            }
            50% {
                transform: scale(0.98);
                filter: brightness(1.12);
                box-shadow: 0 0 0 4px rgba(0, 136, 255, 0.08);
            }
            100% {
                transform: scale(1);
                filter: brightness(1);
                box-shadow: 0 0 0 rgba(0, 136, 255, 0);
            }
        }

        button:active,
        .nav-item:active,
        .mobile-menu-btn:active,
        .chip:active,
        summary:active,
        .chapter-item:active,
        .brow-head:active {
            animation: tap-feedback 0.18s ease-out;
        }

        /* --- HEADER --- */
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--accent-blue);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-svg {
            height: 32px;
            width: 32px;
            object-fit: contain;
            display: block;
        }

        .site-title {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
            color: white;
        }

        .site-subtitle {
            font-size: 0.8rem;
            color: var(--accent-blue);
            display: none;
        }

        @media(min-width: 600px) {
            .site-subtitle { display: inline-block; }
        }

        /* --- LAYOUT CONTAINER --- */
        .app-container {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* --- SIDEBAR NAVIGATION --- */
        nav {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .nav-label {
            padding: 1rem 1.5rem 0.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: bold;
        }

        .nav-item {
            padding: 12px 1.5rem;
            cursor: pointer;
            border-left: 3px solid transparent;
            color: var(--text-muted);
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .nav-item:hover {
            background-color: var(--bg-card);
            color: white;
        }

        .nav-item.active {
            background-color: rgba(0, 102, 204, 0.1);
            border-left-color: var(--accent-blue-bright);
            color: white;
            font-weight: 500;
        }

        nav a.nav-item {
            text-decoration: none;
            display: block;
        }

        /* --- MAIN CONTENT AREA --- */
        main {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2rem;
            padding-bottom: calc(2rem + env(safe-area-inset-bottom));
            position: relative;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Wide tables (e.g. mantissa/exponent bit tables) get their own
           horizontal scrollbar instead of pushing the whole page sideways. */
        .table-scroll {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 1rem 0;
        }

        .table-scroll table {
            margin: 0;
        }

        section {
            display: none;
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease-in-out;
        }

        section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: white;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.3rem;
            color: var(--accent-blue-bright);
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        h3 {
            font-size: 1.1rem;
            color: white;
            margin-top: 1.2rem;
            margin-bottom: 0.5rem;
        }

        p {
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        ul, ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        li {
            margin-bottom: 0.4rem;
        }

        strong {
            color: white;
        }

        /* --- CARDS & BOXES --- */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 2px solid var(--accent-blue);
        }

        .card:hover {
            border-color: var(--accent-blue);
            background-color: var(--bg-card-hover);
        }

        .card > h3:first-child {
            color: var(--accent-blue-bright);
            margin-top: 0;
        }

        /* --- NOTES / CALLOUTS --- */
        .note {
            background-color: rgba(0, 102, 204, 0.08);
            border-left: 3px solid var(--accent-blue-bright);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin: 0.75rem 0;
            font-size: 0.95rem;
        }

        .note::before {
            content: 'NOTE ';
            font-weight: bold;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--accent-blue-bright);
            display: block;
            margin-bottom: 2px;
        }

        /* --- TABLES --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: rgba(0, 102, 204, 0.2);
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        table.bits th {
            text-align: center;
            background-color: rgba(0, 102, 204, 0.25);
            font-family: var(--code-font);
            padding: 6px 10px;
            white-space: nowrap;
        }

        /* --- CODE BLOCKS --- */
        code {
            font-family: var(--code-font);
            background-color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--accent-blue-bright);
            font-size: 0.9em;
        }

        pre {
            background-color: #000;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1rem 0;
        }

        pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text-main);
            display: block;
            line-height: 1.5;
        }

        /* --- ACCORDION (DETAILS/SUMMARY) --- */
        details {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
            border-radius: 4px;
        }

        summary {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-main);
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: '+';
            font-weight: bold;
            color: var(--accent-blue);
        }

        details[open] summary::after {
            content: '-';
        }

        details[open] summary {
            border-bottom: 1px solid var(--border-color);
            color: white;
        }

        .details-content {
            padding: 1rem;
        }

        /* --- PDF DOWNLOAD CHIP --- */
        .chapter-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .chapter-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            background-color: rgba(0, 102, 204, 0.15);
            border: 1px solid var(--accent-blue);
            border-radius: 20px;
            color: var(--accent-blue-bright);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .chip:hover {
            background-color: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue-bright);
        }

        .chip svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        /* --- STATUS / ERROR --- */
        .status-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue-bright);
            padding: 1.5rem;
            border-radius: 4px;
            max-width: 900px;
            margin: 2rem auto;
        }

        .status-box.warn {
            border-left-color: #d4760a;
        }

        /* --- MOBILE NAV TOGGLE --- */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }

            nav {
                position: absolute;
                top: 60px;
                bottom: 0;
                left: 0;
                height: auto;
                z-index: 20;
                transform: translateX(-100%);
                box-shadow: 4px 0 10px rgba(0,0,0,0.5);
            }

            nav.open {
                transform: translateX(0);
            }

            main {
                padding: 1rem;
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }

            .table-row {
                flex-direction: column;
                gap: 10px;
            }

            .table-row table {
                width: 100%;
            }
        }

        /* --- TABLE PAIR (side-by-side) --- */
        .table-row {
            display: flex;
            gap: 35px;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            align-items: flex-start;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            .table-row { gap: 15px; }
        }

        .table-row table {
            width: 50%;
            border-collapse: collapse;
            margin: 0;
        }

        @media (max-width: 768px) {
            .table-row table { width: 100%; }
        }

        .table-row th,
        .table-row td {
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            text-align: center;
        }

        .table-row th {
            font-weight: bold;
            color: var(--accent-blue-bright);
        }

        /* --- STUDY: FLASHCARDS & QUIZ --- */
        .study-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            font-family: var(--font-family);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .filter-chip:hover:not(:disabled) { border-color: var(--accent-blue); color: white; }
        .filter-chip.active { background: rgba(0, 102, 204, 0.25); border-color: var(--accent-blue-bright); color: white; }
        .filter-chip:disabled { opacity: 0.4; cursor: not-allowed; }

        .mode-toggle {
            display: inline-flex;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .mode-toggle button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-family);
            padding: 6px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-toggle button.active { background: var(--accent-blue); color: white; }

        .progress-info {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-blue-bright);
            width: 0%;
            transition: width 0.3s ease;
        }

        .flashcard {
            perspective: 1200px;
            height: 280px;
            margin: 1rem auto 1.5rem;
            cursor: pointer;
            max-width: 640px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.75rem 1.5rem;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue-bright);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .flashcard-front { text-align: center; }

        .flashcard-back {
            transform: rotateY(180deg);
            align-items: flex-start;
            justify-content: flex-start;
            text-align: left;
        }

        .fc-term {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--accent-blue-bright);
            line-height: 1.4;
        }

        .fc-hint {
            margin-top: 0.9rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .fc-def { font-size: 1.02rem; color: var(--text-main); }

        .fc-extra {
            margin-top: 0.75rem;
            padding: 0.55rem 0.8rem;
            background: rgba(0, 102, 204, 0.08);
            border-left: 2px solid var(--accent-blue);
            border-radius: 4px;
            font-size: 0.88rem;
            color: var(--text-main);
            width: 100%;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .fc-extra .fc-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue-bright);
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .fc-chapter {
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .knowledge-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 0.25rem 0 1rem;
            flex-wrap: wrap;
        }

        .study-btn {
            font-family: var(--font-family);
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 9px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .study-btn:hover { border-color: var(--accent-blue-bright); color: white; }
        .study-btn.primary { background-color: var(--accent-blue); border-color: var(--accent-blue); color: white; font-weight: 600; }
        .study-btn.primary:hover { background-color: var(--accent-blue-bright); }
        .study-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-know {
            background: rgba(38, 222, 129, 0.12);
            border: 1px solid #26de81;
            color: #26de81;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: var(--font-family);
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-know:hover { background: #26de81; color: #050505; }

        .btn-dont {
            background: rgba(229, 80, 57, 0.12);
            border: 1px solid #e55039;
            color: #e55039;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: var(--font-family);
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .btn-dont:hover { background: #e55039; color: white; }

        .study-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .session-stats {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.9rem;
        }

        .quiz-setup {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-blue);
            border-radius: 6px;
            padding: 1.5rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .quiz-setup-hint { color: var(--text-muted); font-size: 0.88rem; margin: 0.75rem 0 1rem; }

        .quiz-count-row { margin: 1rem 0; max-width: 260px; }

        .quiz-count-row label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .quiz-count-row select {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .quiz-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 1.1rem;
            flex-wrap: wrap;
        }

        .score-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .score-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 12px;
        }

        .score-badge.green { background: rgba(38, 222, 129, 0.15); color: #26de81; }
        .score-badge.red { background: rgba(229, 80, 57, 0.15); color: #e55039; }
        .score-badge.blue { background: rgba(0, 128, 255, 0.15); color: var(--accent-blue-bright); }

        .game-timer {
            margin-left: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .game-timer.danger { color: #e55039; font-weight: 700; }

        .qz-quit {
            font-family: var(--font-family);
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qz-quit:hover { border-color: #e55039; color: #e55039; }

        .quiz-question {
            font-size: 1.12rem;
            font-weight: 600;
            color: white;
            margin: 1rem 0 1.1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 0 1rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .quiz-opt {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            touch-action: manipulation;
        }

        .quiz-opt:hover:not(.disabled) {
            border-color: var(--accent-blue-bright);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .quiz-opt.correct { border-color: #26de81; background: rgba(38, 222, 129, 0.12); }
        .quiz-opt.wrong { border-color: #e55039; background: rgba(229, 80, 57, 0.12); }
        .quiz-opt.disabled { cursor: default; opacity: 0.9; }

        .explanation {
            background: rgba(0, 102, 204, 0.08);
            border-left: 3px solid var(--accent-blue-bright);
            padding: 0.8rem 1rem;
            border-radius: 4px;
            margin: 0.5rem auto 0;
            font-size: 0.92rem;
            max-width: 700px;
        }

        .qz-results { text-align: center; }
        .qz-emoji { font-size: 2.6rem; margin-bottom: 6px; }
        .qz-results h3 { font-size: 1.4rem; color: white; }
        .qz-wrong { text-align: left; margin-top: 1.1rem; border-top: 1px solid var(--border-color); padding-top: 1rem; }
        .qz-wrong-title { font-weight: 700; color: var(--accent-blue-bright); margin-bottom: 0.6rem; font-size: 0.9rem; }
        .qz-wrong-item { font-size: 0.85rem; padding: 0.6rem 0.7rem; background: rgba(229, 80, 57, 0.06); border-radius: 4px; margin-bottom: 0.5rem; }
        .qz-wrong-item em { color: var(--text-muted); }

        @media (max-width: 640px) {
            .quiz-options { grid-template-columns: 1fr; }
            .flashcard { height: 320px; }
            .study-toolbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <img class="logo-svg" src="Logo%20(2).png" alt="A2CS logo">
            <div>
                <span class="site-title">A2CS</span>
                <span class="site-subtitle">Exam Prep</span>
            </div>
        </div>
        <button class="mobile-menu-btn" onclick="toggleMenu()">☰</button>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation (generated from db.json) -->
        <nav id="sidebar">
            <div class="nav-label">Chapters</div>
            <div id="nav-chapters"></div>
            <div class="nav-label" style="margin-top: 2rem;">Study</div>
            <div id="nav-study">
                <div class="nav-item" data-target="study-flashcards" onclick="showSection('study-flashcards')">🃏 Flashcards</div>
                <div class="nav-item" data-target="study-quiz" onclick="showSection('study-quiz')">📝 Quiz</div>
            </div>
            <div class="nav-label" style="margin-top: 2rem;">Settings</div>
            <a class="nav-item" href="admin.html">Admin Panel</a>
        </nav>

        <!-- Main Content -->
        <main id="main">
            <div class="status-box" id="loading-box">
                <strong>Loading notes&hellip;</strong>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="study.js"></script>
    <script>
        const ESCAPE_ALLOWED = { strong: true, code: true, em: true };

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Allows a small set of safe inline markup in block text
        function safeHtml(str) {
            return escapeHtml(str).replace(/&lt;(\/?(?:strong|code|em))&gt;/g, '<$1>');
        }

        // --- Block renderers ---
        function renderBlocks(blocks, container) {
            blocks.forEach(function (b) {
                var el = renderBlock(b);
                if (el) container.appendChild(el);
            });
        }

        function renderBlock(b) {
            var el;
            switch (b.type) {
                case 'p':
                    el = document.createElement('p');
                    el.innerHTML = safeHtml(b.text || '');
                    return el;

                case 'h2':
                    el = document.createElement('h2');
                    el.innerHTML = safeHtml(b.text || '');
                    return el;

                case 'h3':
                    el = document.createElement('h3');
                    el.innerHTML = safeHtml(b.text || '');
                    return el;

                case 'list':
                    el = document.createElement(b.style === 'ol' ? 'ol' : 'ul');
                    (b.items || []).forEach(function (item) {
                        var li = document.createElement('li');
                        li.innerHTML = safeHtml(item);
                        el.appendChild(li);
                    });
                    return el;

                case 'note': {
                    var d = document.createElement('div');
                    d.className = 'note';
                    d.innerHTML = safeHtml(b.text || '');
                    return d;
                }

                case 'card': {
                    var card = document.createElement('div');
                    card.className = 'card';
                    if (b.title) {
                        var h = document.createElement('h3');
                        h.innerHTML = safeHtml(b.title);
                        card.appendChild(h);
                    }
                    renderBlocks(b.blocks || [], card);
                    return card;
                }

                case 'code': {
                    var pre = document.createElement('pre');
                    var code = document.createElement('code');
                    code.textContent = b.text || '';
                    pre.appendChild(code);
                    return pre;
                }

                case 'table': {
                    var t = document.createElement('table');
                    var head = document.createElement('thead');
                    var hr = document.createElement('tr');
                    (b.headers || []).forEach(function (h) {
                        var th = document.createElement('th');
                        th.textContent = h;
                        hr.appendChild(th);
                    });
                    head.appendChild(hr);
                    t.appendChild(head);
                    var body = document.createElement('tbody');
                    (b.rows || []).forEach(function (row) {
                        var tr = document.createElement('tr');
                        row.forEach(function (c) {
                            var td = document.createElement('td');
                            td.textContent = c;
                            tr.appendChild(td);
                        });
                        body.appendChild(tr);
                    });
                    t.appendChild(body);
                    var wrap = document.createElement('div');
                    wrap.className = 'table-scroll';
                    wrap.appendChild(t);
                    return wrap;
                }

                case 'bits': {
                    var bt = document.createElement('table');
                    bt.className = 'bits';
                    var tr = document.createElement('tr');
                    (b.cells || []).forEach(function (c) {
                        var th = document.createElement('th');
                        th.textContent = c;
                        tr.appendChild(th);
                    });
                    bt.appendChild(tr);
                    var bwrap = document.createElement('div');
                    bwrap.className = 'table-scroll';
                    bwrap.appendChild(bt);
                    return bwrap;
                }

                case 'tablePair': {
                    var row = document.createElement('div');
                    row.className = 'table-row';
                    ['left', 'right'].forEach(function (side) {
                        var p = b[side];
                        if (!p) return;
                        var t = document.createElement('table');
                        var tr = document.createElement('tr');
                        var th = document.createElement('th');
                        th.textContent = p.header || '';
                        tr.appendChild(th);
                        t.appendChild(tr);
                        (p.cells || []).forEach(function (c) {
                            var tr2 = document.createElement('tr');
                            var td = document.createElement('td');
                            td.textContent = c;
                            tr2.appendChild(td);
                            t.appendChild(tr2);
                        });
                        row.appendChild(t);
                    });
                    return row;
                }

                case 'details': {
                    var det = document.createElement('details');
                    var sum = document.createElement('summary');
                    sum.innerHTML = safeHtml(b.summary || 'Details');
                    det.appendChild(sum);
                    var dc = document.createElement('div');
                    dc.className = 'details-content';
                    renderBlocks(b.blocks || [], dc);
                    det.appendChild(dc);
                    return det;
                }

                default:
                    return null;
            }
        }

        // --- App render ---
        function buildApp(data) {
            var navChapters = document.getElementById('nav-chapters');
            var main = document.getElementById('main');
            navChapters.innerHTML = '';
            main.innerHTML = '';

            var first = true;
            data.chapters.forEach(function (ch, i) {
                var navItem = document.createElement('div');
                navItem.className = 'nav-item' + (first ? ' active' : '');
                navItem.setAttribute('data-target', ch.id);
                navItem.textContent = (i + 1) + '. ' + ch.title;
                navItem.onclick = function () {
                    showSection(ch.id);
                };
                navChapters.appendChild(navItem);

                var sec = document.createElement('section');
                sec.id = ch.id;
                if (first) sec.className = 'active';

                var h1 = document.createElement('h1');
                h1.textContent = (i + 1) + '. ' + ch.title;
                sec.appendChild(h1);

                var meta = document.createElement('div');
                meta.className = 'chapter-meta';
                if (ch.subtitle) {
                    var sub = document.createElement('p');
                    sub.className = 'chapter-subtitle';
                    sub.textContent = ch.subtitle;
                    meta.appendChild(sub);
                }
                if (ch.pdf) {
                    var a = document.createElement('a');
                    a.className = 'chip';
                    a.href = ch.pdf;
                    a.download = '';
                    a.title = 'Download ' + ch.title + ' notes (PDF)';
                    a.innerHTML = '<svg viewBox="0 0 16 16"><path d="M8 1a1 1 0 0 1 1 1v6.59l2.29-2.3a1 1 0 0 1 1.42 1.42l-4 4a1 1 0 0 1-1.42 0l-4-4A1 1 0 0 1 4.71 6.3L7 8.59V2a1 1 0 0 1 1-1zM2 1[...]"></path></svg> PDF';
                    meta.appendChild(a);
                }
                sec.appendChild(meta);

                renderBlocks(ch.blocks || [], sec);
                main.appendChild(sec);

                first = false;
            });
        }

        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(function (s) {
                s.classList.toggle('active', s.id === sectionId);
            });
            document.querySelectorAll('.nav-item[data-target]').forEach(function (n) {
                n.classList.toggle('active', n.getAttribute('data-target') === sectionId);
            });
            closeMenu();
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeMenu() {
            var nav = document.getElementById('sidebar');
            if (nav.classList.contains('open')) nav.classList.remove('open');
        }

        // --- Load data ---
        fetch('db.json', { cache: 'no-store' })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (data) {
                if (!data || !Array.isArray(data.chapters) || data.chapters.length === 0) {
                    throw new Error('No chapters found in db.json');
                }
                buildApp(data);
                if (window.Study) window.Study.init(data);
            })
            .catch(function (err) {
                document.getElementById('loading-box').outerHTML =
                    '<div class="status-box warn">' +
                        '<h2 style="margin-top:0;color:#d4760a;">Could not load notes</h2>' +
                        '<p>Unable to read <code>db.json</code> (' + escapeHtml(err.message) + ').</p>' +
                        '<p>This page must be hosted over HTTP(S) alongside <code>db.json</code> ' +
                        '(for example on Vercel, GitHub Pages, or a local server like <code>npx serve</code>).</p>' +
                    '</div>';
            });
    </script>
</body>
</html>
